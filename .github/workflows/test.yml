name: Tes gallery

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node test/run.js
      - name: Cek celah keamanan dependency
        run: npm audit --omit=dev --audit-level=high
